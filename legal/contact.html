<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — SmartLifeCalc</title>
  <meta name="description" content="Contact the SmartLifeCalc team with questions, suggestions, or feedback.">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <meta name="p:domain_verify" content="52fc436f906da3c2e83935b9d6f33d20"/>
</head>
<body>
  <header class="header">
    <div class="container header-nav">
      <a href="/index.html" class="logo">SmartLife<span>Calc</span></a>
    </div>
  </header>

  <main>
    <div class="container" style="max-width: 700px;">
      <nav class="breadcrumb">
        <a href="/index.html">Home</a>
        <span class="separator">/</span>
        <span>Contact Us</span>
      </nav>

      <div class="calc-card">
        <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem;">Contact SmartLifeCalc</h1>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Have a question, feedback, or a suggestion for a new calculator? We'd love to hear from you!</p>

        <form onsubmit="event.preventDefault(); alert('Thank you for your message! We will get back to you shortly.');">
          <div class="form-group">
            <label for="contactName">Your Name</label>
            <input type="text" id="contactName" class="form-control" required placeholder="John Doe">
          </div>

          <div class="form-group">
            <label for="contactEmail">Email Address</label>
            <input type="email" id="contactEmail" class="form-control" required placeholder="john@example.com">
          </div>

          <div class="form-group">
            <label for="contactMessage">Message</label>
            <textarea id="contactMessage" class="form-control" rows="5" required placeholder="How can we help you?"></textarea>
          </div>

          <button type="submit" class="btn-primary">Send Message</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 SmartLifeCalc. All rights reserved.</p>
      </div>
    </div>
  </footer>
</body>
</html>
